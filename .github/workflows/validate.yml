name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: >-
          node --check server.js &&
          node --check db.js &&
          node --check public/js/main.js &&
          node --check portfolio/restaurant/app.js &&
          node --check portfolio/sw.js

      - name: Check calculator scripts and PWA manifests
        run: |
          node -e 'const fs = require("node:fs"); const html = fs.readFileSync("portfolio/calculator/index.html", "utf8"); for (const match of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(match[1]); for (const file of ["portfolio/manifest.webmanifest", "portfolio/calculator/manifest.webmanifest", "portfolio/restaurant/manifest.webmanifest"]) JSON.parse(fs.readFileSync(file, "utf8"));'